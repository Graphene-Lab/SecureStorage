name: Publish NuGet Package

# GENERAL release rule (AgentBridge/Graphene convention): a plain push is a code sync and
# publishes nothing. Publishing is explicit and versioned: push a tag v* (e.g. v1.26.09.09)
# and this workflow packs SecureStorage.csproj and publishes it to nuget.org.
on:
  push:
    tags: ['v*']

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pack
        shell: bash
        env:
          VER: ${{ github.ref_name }}
        run: |
          VER="${VER#v}"
          dotnet pack SecureStorage.csproj -c Release -o ./out \
            -p:Version="$VER" -p:SkipNuGetPush=true
      - name: NuGet login (trusted publishing, no stored key)
        uses: NuGet/login@v1
        id: login
        with:
          user: kocahoctpa
      - name: Push to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NuGet login failed (trusted publishing policy mismatch, or id-token: write missing) — the package was NOT published."
            exit 1
          fi
          dotnet nuget push ./out/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
